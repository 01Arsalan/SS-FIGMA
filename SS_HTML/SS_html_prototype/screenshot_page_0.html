Here's the HTML code to create a web page that looks exactly like the image:

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 p-8">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-semibold">Welcome back!</h1>
                <p class="text-gray-400">Here's a list of your tasks for this month!</p>
            </div>
            <div class="bg-gray-700 rounded-full p-2">
                <img src="https://placehold.co/40x40" alt="User avatar" class="rounded-full">
            </div>
        </div>
        
        <div class="flex justify-between items-center mb-4">
            <div class="relative">
                <input type="text" placeholder="Filter tasks..." class="bg-gray-800 rounded-md py-2 px-4 pr-10 w-64">
                <i class="fas fa-search absolute right-3 top-3 text-gray-400"></i>
            </div>
            <div class="flex space-x-2">
                <button class="bg-gray-800 px-3 py-2 rounded-md flex items-center">
                    <i class="fas fa-plus mr-2"></i> Status
                </button>
                <button class="bg-gray-800 px-3 py-2 rounded-md flex items-center">
                    <i class="fas fa-plus mr-2"></i> Priority
                </button>
            </div>
            <button class="bg-gray-800 px-3 py-2 rounded-md flex items-center">
                <i class="fas fa-th-large mr-2"></i> View
            </button>
        </div>
        
        <table class="w-full">
            <thead>
                <tr class="text-left text-gray-400 border-b border-gray-700">
                    <th class="py-2 px-4"><input type="checkbox" class="rounded bg-gray-700 border-gray-600"></th>
                    <th class="py-2 px-4">Title <i class="fas fa-sort-down ml-1"></i></th>
                    <th class="py-2 px-4">Status <i class="fas fa-sort-down ml-1"></i></th>
                    <th class="py-2 px-4">Priority <i class="fas fa-sort-down ml-1"></i></th>
                    <th class="py-2 px-4"></th>
                </tr>
            </thead>
            <tbody>
                <tr class="border-b border-gray-800">
                    <td class="py-3 px-4"><input type="checkbox" class="rounded bg-gray-700 border-gray-600"></td>
                    <td class="py-3 px-4">
                        <div class="font-medium">TASK-8782</div>
                        <div class="text-gray-500">Documentation</div>
                        <div class="text-sm text-gray-400">You can't compress the program without quantifying the open-source SSD...</div>
                    </td>
                    <td class="py-3 px-4"><span class="bg-blue-900 text-blue-300 px-2 py-1 rounded-full text-xs">In Progress</span></td>
                    <td class="py-3 px-4"><span class="text-yellow-500"><i class="fas fa-arrow-right"></i> Medium</span></td>
                    <td class="py-3 px-4 text-right"><i class="fas fa-ellipsis-h text-gray-500"></i></td>
                </tr>
                <!-- Repeat the above <tr> structure for each task, changing the details as needed -->
            </tbody>
        </table>
    </div>
</body>
</html>
